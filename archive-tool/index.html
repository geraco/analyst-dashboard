<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Archive" />
  <meta name="theme-color" content="#1a56db" />
  <title>Archive URL</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a56db'/%3E%3Ctext x='32' y='46' font-size='40' font-family='Arial%2Csans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a56db'/%3E%3Ctext x='32' y='46' font-size='40' font-family='Arial%2Csans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 640px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: #1a56db;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: white;
      flex-shrink: 0;
      user-select: none;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px 16px;
      background: #1e2130;
      border: 1px solid #2e3350;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 20px;
      -webkit-appearance: none;
    }

    input[type="text"]::placeholder { color: #3e4a6a; }
    input[type="text"]:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }

    .result-box {
      background: #1e2130;
      border: 1px solid #2e3350;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.95rem;
      color: #60a5fa;
      word-break: break-all;
      min-height: 52px;
      margin-bottom: 16px;
      transition: border-color 0.15s, box-shadow 0.15s;
      line-height: 1.5;
    }

    .result-box.has-content {
      border-color: #1d4ed8;
    }

    .placeholder {
      color: #3e4a6a;
      font-style: italic;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(0.97); }

    #copy-btn {
      background: #1e3a5f;
      color: #93c5fd;
    }
    #copy-btn:hover { background: #1d4ed8; color: white; }
    #copy-btn.copied { background: #064e3b; color: #6ee7b7; }

    #open-btn {
      background: #1a56db;
      color: white;
    }
    #open-btn:hover { background: #2563eb; }

    .hint {
      margin-top: 14px;
      font-size: 0.78rem;
      color: #3e4a6a;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <span class="icon">A</span>
      Archive URL
    </h1>

    <label for="url-input">Paste URL</label>
    <input
      type="text"
      id="url-input"
      placeholder="https://example.com/article"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
    />

    <label>Archive Link</label>
    <div class="result-box" id="result-box">
      <span class="placeholder">Result will appear here…</span>
    </div>

    <div class="buttons">
      <button id="copy-btn">Copy</button>
      <button id="open-btn">Open</button>
    </div>

    <p class="hint">Enter or tap Open to visit &nbsp;·&nbsp; Copy saves to clipboard</p>
  </div>

  <script>
    var input   = document.getElementById('url-input');
    var box     = document.getElementById('result-box');
    var copyBtn = document.getElementById('copy-btn');
    var openBtn = document.getElementById('open-btn');

    function archiveUrl(raw) {
      var stripped = raw.trim().replace(/^https?:\/\//, '');
      return stripped ? 'https://archive.is/' + stripped : '';
    }

    function updateResult() {
      var url = archiveUrl(input.value);
      if (url) {
        box.textContent = url;
        box.classList.add('has-content');
      } else {
        box.innerHTML = '<span class="placeholder">Result will appear here…</span>';
        box.classList.remove('has-content');
      }
    }

    input.addEventListener('input', updateResult);

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var url = archiveUrl(input.value);
        if (url) window.open(url, '_blank');
      }
    });

    copyBtn.addEventListener('click', function () {
      var url = archiveUrl(input.value);
      if (!url) return;
      navigator.clipboard.writeText(url).then(function () {
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(function () {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 1500);
      });
    });

    openBtn.addEventListener('click', function () {
      var url = archiveUrl(input.value);
      if (url) window.open(url, '_blank');
    });
  </script>
</body>
</html>
